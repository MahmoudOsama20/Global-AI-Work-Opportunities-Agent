[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-ai-opportunities-agent"
version = "0.1.0"
description = "Global AI Opportunities Intelligence Agent"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "pyyaml>=6.0.2",
    "rich>=13.9.2",
    "typer>=0.12.5",
    "rapidfuzz>=3.10.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.48.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
