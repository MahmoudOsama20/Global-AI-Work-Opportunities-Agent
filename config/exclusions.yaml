# Strict Exclusion Rules Configuration

speech_and_audio:
  description: "Mandatory exclusion of all speech, voice, and audio tasks even if they mention AI."
  keywords:
    - "speech recognition"
    - "automatic speech recognition"
    - "asr"
    - "text-to-speech"
    - "tts"
    - "speech synthesis"
    - "voice ai"
    - "voice assistant"
    - "voice assistants"
    - "audio processing"
    - "audio classification"
    - "audio transcription"
    - "transcription"
    - "transcribe audio"
    - "transcribing"
    - "speech annotation"
    - "voice data collection"
    - "voice recording"
    - "audio labeling"
    - "audio annotation"
    - "audio generation"
    - "speaker recognition"
    - "phonetics"
    - "phonetic"
    - "audio model evaluation"
    - "acoustic modeling"
    - "whisper fine-tuning"
    - "sound processing"
    - "speech-to-text"
    - "stt"
  strict_mode: true

automation_as_job_category:
  description: "Exclusion of non-AI generic automation, industrial automation, and RPA."
  keywords:
    - "robotic process automation"
    - "rpa"
    - "uipath"
    - "blue prism"
    - "automation anywhere"
    - "industrial automation"
    - "plc programming"
    - "scada"
    - "industrial control systems"
    - "workflow automation"
    - "business process automation"
    - "bpa"
    - "test automation engineer"
    - "selenium test automation"
    - "qa test automation"
    - "automation engineering"
  exceptions:
    - "ai agent"
    - "agentic ai"
    - "multi-agent"
    - "mlops"
    - "ai deployment"
    - "model serving"

irrelevant_work:
  description: "General non-technical or non-AI jobs."
  keywords:
    - "data entry clerk"
    - "generic data entry"
    - "virtual assistant"
    - "administrative assistant"
    - "customer service representative"
    - "graphic designer"
    - "logo designer"
    - "seo content writer"
    - "wordpress developer"
    - "shopify developer"
    - "unpaid internship"
    - "unpaid project"
    - "volunteer opportunity"
    - "commission only"

quality_and_scam_flags:
  description: "Indicators of scams, fake listings, or suspicious requests."
  suspicious_keywords:
    - "pay upfront fee"
    - "send money for equipment"
    - "purchase check"
    - "wire funds back"
    - "telegram only for interview"
    - "whatsapp only for interview"
    - "free sample work without payment"
    - "cashiers check"
    - "unlimited earning potential with no experience"
